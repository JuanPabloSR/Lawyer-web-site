<div class="work1 sp">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 m-auto text-center">
                <div class="heading1">
                    <span data-aos="fade-left" data-aos-duration="900"
                        class="sub-title1 sec-bg2 rounded-6 p-8-12 text-18 leading-18 inline-block sub-text1 uppercase mb-20 font-medium">Cómo Trabajamos</span>
                    <h2 class="black1 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Nuestra Metodología Legal</h2>
                </div>
            </div>
        </div>
        <div class="space30"></div>
        <div class="row work1-border">
            <div *ngFor="let step of workSteps" class="col-lg-3 col-md-6" data-aos="zoom-in-up" data-aos-duration="800">
                <div class="work1-box text-center mt-30">
                    <div class="image">
                        <img [src]="step.image" alt="">
                    </div>
                    <div class="content-area">
                        <p class="number">
                            {{step.id}}
                        </p>
                        <h4><a routerLink="/case-details"
                                class="black1 font-24 text _hover1 leading-24 font-semibold">{{step.title}}</a></h4>
                        <p class="text-18 leading-26 font-medium gray1 mt-16 mb-16">{{step.description}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
