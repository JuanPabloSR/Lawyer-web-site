<div class="blog1 sp white-bg3">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 m-auto text-center">
                <div class="heading1">
                    <span data-aos="fade-left" data-aos-duration="900"
                        class="sub-title1 sec-bg1 rounded-6 p-8-12 text-18 leading-18 inline-block sub-text1 uppercase mb-20 font-medium">Nuestro Blog</span>
                    <h2 class="black1 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Manténgase
                        Informado con Nuestros Artículos</h2>
                </div>
            </div>
        </div>

        <div class="row mt-30">
            <div *ngFor="let blog of blogs.slice(0,3)" class="col-lg-4 col-md-6" data-aos="zoom-in-up"
                [attr.data-aos-duration]="blog.duration">
                <app-blog-card [blog]="blog" />
            </div>
        </div>
    </div>
</div>
