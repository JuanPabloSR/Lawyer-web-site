<div class="hero4 z-1">
    <div class="container">
       <div class="row align-items-center">
          <div class="col-lg-6">
             <div class="main-heading">
                <span data-aos="fade-left" data-aos-duration="800" class="sub-title"><img src="assets/img/hero/hero4-title.png" alt=""> 15+ Years Of Experience</span>
                <h1 class="text-56 md:text-40 text-anime-style-3 sm:text-40 leading64 inline-block font-semibold">Business With Expert Corporate Consulting</h1>
                <p data-aos="fade-left" data-aos-duration="1000" class="mt-16 text-18 leading-26 font-medium inline-block">We specialize in providing tailored consulting services that drive success an transformation for businesses of all sizes.</p>
                <div class="buttons mt-30" data-aos="fade-left" data-aos-duration="1200">
                    <a class="theme-btn5" routerLink="/our-services"><span class="text">Schedule A Consultation</span><span class="arrow-all"><span class="arrow1"><img src="assets/img/icons/button4-arrow.svg" alt=""></span><span class="arrow2"><img src="assets/img/icons/button4-arrow.svg" alt=""></span></span></a>

                    <div class="video-buttton4 play-btn" (click)="openVideoModal()">
                      <a id="play-video" class="video-play-button">
                          <span></span>
                      </a>
                        <p>Play Video</p>
                  </div>
                </div>

                <ng-template #videoModal let-modal>
                    <div class="modal-body p-0 position-relative rounded-3 overflow-hidden">
                        <button type="button"
                            class="btn-close btn btn-light rounded-circle bg-white p-2 position-absolute top-0 end-0 m-3"
                            aria-label="Close" (click)="modal.dismiss()"></button>

                        <iframe width="100%" height="400"
                            src="https://www.youtube.com/watch?v=Y8XpQpW5OVY" frameborder="0"
                            allowfullscreen></iframe>
                    </div>
                </ng-template>
            </div>
          </div>
          <div class="col-lg-6">
             <div class="images">
                <div class="image1">
                   <img src="assets/img/hero/hero4-image1.png" alt="">
                </div>
                <div class="image2">
                   <img src="assets/img/hero/hero4-image2.png" alt="">
                </div>
                <div class="shape1 animate1">
                   <img src="assets/img/shapes/hero4-shape1.png" alt="">
                </div>
                <div class="shape2">
                   <img src="assets/img/shapes/hero4-shape2.png" alt="">
                </div>
             </div>
          </div>
       </div>
    </div>
 </div>
