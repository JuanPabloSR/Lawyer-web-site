<div class="tes4 sp bg-cover" style="background-image: url(assets/img/bg/tes4-bg.jpg);">
    <div class="container">
       <div class="row">
          <div class="col-lg-6">
             <div class="heading3">
                <span data-aos="fade-left" data-aos-duration="800" class="white1 leading-18 text-18 mb-16 inline-block font-semibold uppercase sub-title3-w">our testimonial</span>
                <h2 class="white1 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Hear From Our Satisfied Clients</h2>
            </div>
          </div>
          <div class="col-lg-6">
             <div data-aos-duration="800" data-aos="fade-up" class="case4-arrow-buttons text-end _relative z-3 sm:text-start md:text-start">
                <button class="tes4-prev-arrow"><i class="fa-solid fa-angle-left"></i></button>
                <button class="tes4-next-arrow"><i class="fa-solid fa-angle-right"></i></button>
             </div>
          </div>
       </div>
       <div class="row">
          <div class="col-lg-12">
            <ngx-slick-carousel [config]="testimonialConfig" class="tes4-slider mt-60 md:mt-30 sm:mt-30" data-aos-duration="1000" data-aos="fade-up">
                <div ngxSlickItem class="tes4-single-slider" *ngFor="let testimonial of testimonials">
                  <div class="quote">
                    <img src="assets/img/icons/quote4.png" alt="Quote Icon" />
                  </div>
                  <div class="stars">
                    <ul>
                      <li *ngFor="let star of [1,2,3,4,5]">
                        <i class="fa-solid fa-star"></i>
                      </li>
                    </ul>
                  </div>
                  <p>{{ testimonial.message }}</p>
                  <div class="bottom-area">
                    <div class="image">
                      <img [src]="testimonial.image" [alt]="testimonial.name" />
                    </div>
                    <div class="text">
                      <h4><a href="javascript:void(0)">{{ testimonial.name }}</a></h4>
                      <p>{{ testimonial.role }}</p>
                    </div>
                  </div>
                </div>
              </ngx-slick-carousel>
              
          </div>
       </div>
    </div>
 </div>
