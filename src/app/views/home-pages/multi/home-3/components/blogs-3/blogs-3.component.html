<div class="blog3 sp">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 m-auto text-center">
                <div class="heading3">
                    <span class="sub-title3 leading-18 text-18 mb-16 inline-block font-semibold uppercase sub-text3">our blog</span>
                    <h2 class="black3 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Read Our Latest Articles</h2>
                </div>
            </div>
        </div>
        <div class="row mt-30">
            <div *ngFor="let blog of latestBlogs" class="col-lg-6" data-aos="zoom-in-up" data-aos-duration="900">
                <div class="vl-blog-3-item mt-30">
                    <div class="image-area">
                        <div class="vl-blog-3-thumb">
                            <img [src]="blog.image" alt="">
                        </div>
                        <a class="learn2 arrow" routerLink="/case-details"><span class="arrow-all"><span class="arrow1"><i class="fas fa-arrow-right"></i></span><span class="arrow2"><i class="fas fa-arrow-right"></i></span></span></a>
                    </div>
                    <div class="content-area">
                        <div class="vl-blog3-meta">
                            <a href="javascript:void(0)" class="date add-after"><img src="assets/img/icons/blog1-date.svg" alt=""> 26 August 2024</a>
                            <a href="javascript:void(0)" class="user"><img src="assets/img/icons/blog1-user.svg" alt=""> Alex Roy</a>
                        </div>
                        <h4><a routerLink="/blog-details">The Power of Data: Leveraging Analytics for Business Consult Strategic Decisions</a></h4>
                    </div>
                </div>
            </div>

        </div>
    </div>
 </div>
