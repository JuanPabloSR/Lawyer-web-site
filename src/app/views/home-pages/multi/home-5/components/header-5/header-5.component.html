<app-search-popup [isSearchOpen]="isSearchOpen" />
<header>
    <div id="vl-header-sticky" class="vl-header-area5 header-tranperent" stickyScroll>
        <div class="container header5-bg">
            <div class="row align-items-center">
                <div class="col-lg-2 col-md-6 col-6">
                    <div class="vl-logo">
                        <a routerLink="/home-1" class="white-logo"><img src="assets/img/logo/white-logo.png" alt=""></a>
                        <a routerLink="/home-1" class="black-logo"><img src="assets/img/logo/header-logo1.png" alt=""></a>
                    </div>
                </div>
                <div class="col-lg-7 d-none d-lg-block">
                    <div class="vl-main-menu text-center">
                        <nav class="vl-mobile-menu-active">
                            <app-nav-item themeBtn="theme-btn6" [btnSpace]="true" />
                        </nav>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 col-6">
                    <div class="vl-header5-right d-none d-lg-flex">
                        <div class="vl-search-top" (click)="openSearch()">
                            <button class="search-open-btn"><i class="fas fa-magnifying-glass"></i></button>
                        </div>
                        <div class="header5-social-wedget gap-1 d-flex align-items-center flex-wrap">
                            <a href="javascript:void(0)"><i class="fa-brands fa-facebook-f"></i></a>
                            <a href="javascript:void(0)"><i class="fa-brands fa-instagram"></i></a>
                            <a href="javascript:void(0)"><i class="fa-brands fa-linkedin-in"></i></a>
                            <a href="javascript:void(0)"><i class="fa-brands fa-x-twitter"></i></a>
                        </div>
                    </div>
                    <div class="vl-header-action-item d-block d-lg-none">
                        <button type="button" class="vl-offcanvas-toggle" (click)="toggleMenu()">
                            <i class="fa-duotone fa-solid fa-bars-staggered"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<app-mobile-menu [isMenuOpen]="isMenuOpen" (closeMenuEvent)="closeMenu()" themeBtn="theme-btn3" />
