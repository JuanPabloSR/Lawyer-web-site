<div class="team4 sp">
    <div class="container">
        <div class="row">
            <div class="col-lg-5 m-auto text-center">
                <div class="heading4">
                    <span data-aos-duration="800" data-aos="fade-left" class="sub-title4">our financial expert</span>
                    <h2
                        class="black3 text-44 sm:text-30 md:text-30 leading-52 md:leading-36 sm:leading-36 font-semibold text-anime-style-3">
                        Meet Our Expert Team</h2>
                </div>
            </div>
        </div>
        <div class="row mt-30">
            <div class="col-lg-3 col-md-6" *ngFor="let member of teamMembers; let i = index" data-aos="zoom-in-up"
                [attr.data-aos-duration]="1200 - (i * 200)">
                <div class="team4-box mt-50">
                    <div class="image-area">
                        <div class="image">
                            <div class="img">
                                <img [src]="member.image" [alt]="member.name" />
                            </div>
                            <div class="shape1">
                                <img src="assets/img/shapes/team4-team-items-shape1.png" alt="" />
                            </div>
                        </div>
                        <div class="shape2">
                            <img src="assets/img/shapes/team4-team-items-shape2.png" alt="" />
                        </div>
                        <div class="icon-area">
                            <ul>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-facebook-f"></i></a></li>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-instagram"></i></a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="heading4 mt-30">
                        <h4>
                            <a routerLink="/service-details" class="black1 font-24 text _hover5 leading-24 font-semibold">
                                {{ member.name }}
                            </a>
                        </h4>
                        <p class="text-18 leading-26 font-medium gray1 mt-2">{{ member.role }}</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
