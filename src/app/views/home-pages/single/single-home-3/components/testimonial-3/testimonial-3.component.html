<div class="tes3 sp bg-cover" style="background-image: url(assets/img/bg/hero3-bg.jpg);">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 m-auto text-center">
                <div class="heading3">
                    <span
                        class="white1 leading-18 text-18 mb-16 inline-block font-semibold uppercase sub-title3-w">testimonials</span>
                    <h2 class="white1 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">What
                        Our Clients Are Saying</h2>
                </div>
            </div>
        </div>

        <div class="row align-items-center mt-60 md:mt-30 sm:mt-30">
            <div class="col-lg-2"></div>

            <div class="col-lg-6" data-aos="fade-up" data-aos-duration="1000">
                <ngx-slick-carousel class="testimonial-horizental-slider2" [config]="sliderConfig">
                    <div ngxSlickItem class="testimonial-vertical" *ngFor="let testimonial of testimonials">
                        <div class="stars">
                            <ul>
                                <li *ngFor="let star of [1,2,3,4,5]"><i class="fa-solid fa-star"></i></li>
                            </ul>
                        </div>
                        <p>{{ testimonial.message }}</p>
                        <div class="bottom-area-all">
                            <div class="author-area">
                                <div class="image">
                                    <img [src]="testimonial.image" [alt]="testimonial.name">
                                </div>
                                <div class="text">
                                    <h4><a href="javascript:void(0)">{{ testimonial.name }}</a></h4>
                                    <p>{{ testimonial.role }}</p>
                                </div>
                            </div>
                            <div class="brand-logo">
                                <img src="assets/img/logo/tes3-logo.png" alt="">
                            </div>
                        </div>
                    </div>
                </ngx-slick-carousel>

            </div>

            <div class="col-lg-3">
                <div class="slider-area _relative">
                    <ngx-slick-carousel class="slider-boxarea2" [config]="sliderThumbConfig">
                        @for (testimonial of testimonials; track $index;let last=$last;) {
                        <div ngxSlickItem class="slider-box">
                            <div class="img1">
                                <img [src]="testimonial.image" alt="">
                            </div>
                            <div class="content">
                                <a href="javascript:void(0)">{{testimonial.name}}</a>
                                <div class="space10"></div>
                                <p>{{testimonial.role}}</p>
                            </div>
                        </div>
                        <div *ngIf="!last || $index!=3" class="space20"></div>
                        }
                    </ngx-slick-carousel>
                    <div class="tes3-arrows">
                        <div class="prev-arrow">
                            <button><i class="fa-solid fa-angle-up"></i></button>
                        </div>
                        <div class="next-arrow">
                            <button><i class="fa-solid fa-angle-down"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
