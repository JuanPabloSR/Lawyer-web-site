<div class="team2 sp">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 m-auto text-center">
                <div class="heading2">
                    <span data-aos="fade-left" data-aos-duration="800"
                        class="sub-title2 text-18 leading-18 inline-block black3 uppercase mb-20 font-medium"><img
                            src="assets/img/icons/span2.svg" alt="">Our experience Team</span>
                    <h2 class="black3 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Meet to
                        the Experts Behind Your Success</h2>
                </div>
            </div>
        </div>

        <div class="row mt-30">
            <div class="col-lg-4 col-md-6" *ngFor="let member of teamMembers; let i = index"
                [attr.data-aos]="'zoom-in-up'" [attr.data-aos-duration]="800 + (i * 200)">
                <div class="team2-box mt-30">
                    <div class="image-area">
                        <div class="image">
                            <img [src]="member.image" [alt]="member.name" />
                        </div>
                        <div class="social-icons">
                            <ul>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-x-twitter"></i></a></li>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-instagram"></i></a></li>
                                <li><a href="javascript:void(0)"><i class="fa-brands fa-facebook-f"></i></a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="content-area">
                        <div class="heading">
                            <h4><a href="javascript:void(0)" class="text _hover3">{{ member.name }}</a></h4>
                            <p>{{ member.role }}</p>
                        </div>
                        <div class="icon">
                            <img src="assets/img/icons/team2-shere.svg" alt="share icon" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
