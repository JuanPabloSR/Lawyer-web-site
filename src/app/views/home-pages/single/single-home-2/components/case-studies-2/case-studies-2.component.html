<div class="case2 sp">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6">
                <div class="heading2">
                    <span data-aos="fade-left" data-aos-duration="800"
                        class="sub-title2 text-18 leading-18 inline-block black3 uppercase mb-20 font-medium"><img
                            src="assets/img/icons/span2.svg" alt="">our case studies</span>
                    <h2 class="black3 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Explore
                        Client Case Studies</h2>
                </div>
            </div>
            <div class="col-lg-6">
                <div data-aos="fade-up" data-aos-duration="1100"
                    class="case2-arrow-buttons text-end _relative z-3 sm:text-start md:text-start">
                    <button class="case2-prev-arrow"><i class="fa-solid fa-angle-left"></i></button>
                    <button class="case2-next-arrow"><i class="fa-solid fa-angle-right"></i></button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12">

                <ngx-slick-carousel [config]="sliderConfig" class="case2-slider mt-60" data-aos="fade-up" data-aos-duration="900">
                    <div ngxSlickItem class="case2-single-slider" *ngFor="let item of caseStudies">
                        <div class="image-area">
                            <div class="image">
                                <img [src]="item.image" alt="">
                            </div>
                            <div class="hover-area">
                                <a routerLink="/case-details" class="arrow"><i
                                        class="fas fa-arrow-right"></i></a>
                                <p>{{ item.category }}</p>
                                <h4><a routerLink="/case-details" class="_hover3 text">{{ item.title }}</a></h4>
                            </div>
                        </div>
                    </div>
                </ngx-slick-carousel>

            </div>
        </div>
    </div>
</div>
