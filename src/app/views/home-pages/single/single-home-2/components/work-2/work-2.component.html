<div class="work2 sp">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 m-auto text-center">
                <div class="heading2">
                    <span data-aos="fade-left" data-aos-duration="800"
                        class="sub-title2 text-18 leading-18 inline-block black3 uppercase mb-20 font-medium"><img
                            src="assets/img/icons/span2.svg" alt="">How It Works</span>
                    <h2 class="black3 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">
                        Step-By-Step Business Growth</h2>
                </div>
            </div>
        </div>
        <div class="row mt-30">
            <div class="col-lg-4 col-md-6" *ngFor="let step of steps; let i = index" [attr.data-aos]="'fade-up'" [attr.data-aos-duration]="1200 - i * 200">
              <div class="work2-box mt-80">
                <div class="image">
                  <img [src]="step.image" alt="">
                  <div class="number">{{ step.id }}</div>
                </div>
                <div class="content mt-60">
                  <a routerLink="/case-details" class="black3 inline-block font-20 text _hover3 leading-20 font-semibold">
                    {{ step.title }}
                  </a>
                  <p class="text-18 leading-26 font-medium gray3 mt-10">{{ step.description }}</p>
                </div>
              </div>
            </div>
          </div>
          
    </div>
</div>
