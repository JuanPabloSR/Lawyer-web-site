<div class="team1 sp">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6">
                <div class="heading1">
                    <span data-aos="fade-left" data-aos-duration="900"
                        class="sub-title1 sec-bg2 rounded-6 p-8-12 text-18 leading-18 inline-block sub-text1 uppercase mb-20 font-medium">our
                        expert team</span>
                    <h2 class="black1 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">Meet
                        Our Expert Team</h2>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="circle-progress">

                    <div class="row">
                        <div class="col-lg-6 col-md-6">
                            <div class="progresbar-area right-after _relative">
                                        <circle-progress
                                        [percent]="96"
                                        [radius]="36"
                                        [outerStrokeWidth]="5"
                                        [outerStrokeColor]="'#F0C73C'"
                                        [innerStrokeColor]="'#E7E6F1'"
                                        [innerStrokeWidth]="0"
                                        [showTitle]="false"
                                        [unitsFontSize]="'18'"
                                        [showUnits]="true"
                                        [units]="'96%'"
                                        [showSubtitle]="false"
                                        [showInnerStroke]="true"
                                        [animation]="true"
                                        [animationDuration]="800"
                                        [renderOnClick]="false"
                                        [startFromZero]="false">
                                      </circle-progress>
                                <div class="">
                                    <p>Satisfaction Rate</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="progresbar-area _relative">
                                <circle-progress
                                        [percent]="92"
                                        [radius]="36"
                                        [outerStrokeWidth]="5"
                                        [unitsFontSize]="'18'"
                                        [outerStrokeColor]="'#F0C73C'"
                                        [innerStrokeColor]="'#E7E6F1'"
                                        [innerStrokeWidth]="0"
                                        [showTitle]="false"
                                        [showUnits]="true"
                                        [units]="'92%'"
                                        [showSubtitle]="false"
                                        [showInnerStroke]="true"
                                        [animation]="true"
                                        [animationDuration]="800"
                                        [renderOnClick]="false"
                                        [startFromZero]="false">
                                      </circle-progress>
                                <div class="">
                                    <p>Retention Rate</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="space30"></div>
        <div class="row">
            <div *ngFor="let member of teamMembers.slice(0,4)" class="col-lg-3 col-md-6" data-aos="fade-up"
                data-aos-duration="1000">
                <app-member-card [member]="member" />
            </div>

        </div>
    </div>
</div>
