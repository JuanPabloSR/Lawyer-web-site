<div class="blog1 sp shape-bg5 _relative">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 m-auto text-center">
                <div class="heading5">
                    <span class="sub-title5">our articles/Blog</span>
                    <h2
                        class="black3 text-44 sm:text-30 md:text-30 leading-52 md:leading-36 sm:leading-36 font-semibold text-anime-style-3">
                        Stay Ahead With Our Articles</h2>
                </div>
            </div>
        </div>

        <div class="row mt-30">
            <div *ngFor="let blog of blogs.slice(0,3)" class="col-lg-4 col-md-6" data-aos="zoom-in-up"
                [attr.data-aos-duration]="blog.duration">
                <div class="vl-blog-5-item white-bg2 mt-30">
                    <div class="vl-blog-3-thumb overflow-hidden _relative">
                        <img class="w-full" [src]="blog.image" alt="">
                        <div class="vl-blog1-meta">
                            <a href="javascript:void(0)"
                                class="user text _hover6 rounded-6 p-8-12 white-bg1  text-18 leading-18 inline-block black2 mb-20 font-semibold"><img
                                    src="assets/img/icons/blog1-user.svg" alt=""> By {{blog.name}}</a>
                        </div>
                    </div>
                    <div class="vl-blog-1-content p-28">
                        <div class="vl-blog1-meta">
                            <a href="javascript:void(0)" class="date text-18 text _hover6 leading-18 inline-block black1 font-semibold"><img
                                    src="assets/img/icons/blog1-date.svg" alt=""> {{blog.date}}</a>
                        </div>
                        <h4><a routerLink="/blog-details"
                                class="text-20 mt-12 text _hover6 leading-28 inline-block black1 font-semibold">5
                                {{blog.title}}</a></h4>
                        <a routerLink="/blog-details"
                            class="learn1 text _hover6 font-18 uppercase mt-20 leading-18 inline-block black1 font-semibold">learn
                            more <span class="arrow1"><i class="fas fa-arrow-right"></i></span><span class="arrow2"><i
                                    class="fas fa-arrow-right"></i></span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
