<div class="team5 sp">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6 text-center m-auto">
                <div class="heading5">
                    <span class="sub-title5">our expert team</span>
                    <h2
                        class="black3 text-44 sm:text-30 md:text-30 leading-52 md:leading-36 sm:leading-36 font-semibold text-anime-style-3">
                        Meet Our Expert Team</h2>
                </div>
            </div>
        </div>
        <div class="space30"></div>
        <div class="row">
            <div *ngFor="let member of teamMembers.slice(0,4)" class="col-lg-3 col-md-6" data-aos="fade-up"
                data-aos-duration="1000">
                <app-member-card [member]="member" containerClass="team5-box"/>
            </div>
        </div>
    </div>
</div>
