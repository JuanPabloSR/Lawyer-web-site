<div class="blog-page-sec">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="text-center">
                    <h2 class="black1 text-44 sm:text-30 md:text-30 leading-44 font-semibold text-anime-style-3">View
                        More Recent Blog</h2>
                </div>
            </div>
        </div>
        <div class="row mt-30">
            <div *ngFor="let blog of blogs.slice(6,9)" class="col-lg-4 col-md-6">
                <app-blog-card [blog]="blog" />
            </div>
        </div>
    </div>
</div>

<div class="space100"></div>
