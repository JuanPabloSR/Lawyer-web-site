<article>
    <div class="details-content">
        <div class="image">
            <img class="compact-img" [src]="image" [alt]="imageAlt" loading="lazy" decoding="async">
        </div>
        <div class="heading mt-30">
            <h2 class="black1 text-38 sm:text-30 md:text-30 leading-38 font-semibold text-anime-style-3">
                {{ detail.heading }}</h2>
            <p *ngFor="let paragraph of detail.intro" class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ paragraph }}</p>
        </div>

    </div>
</article>

<article>
    <div class="details-content mt-50">
        <div class="row">
            <div class="col-md-6">
                <div class="image">
                    <img class="compact-img" src="assets/img/blog/blog-details-image2.webp" alt="Jorge Alberto Vera Villamizar, socio director de Vera Villamizar Abogados" loading="lazy" decoding="async">
                </div>
            </div>
            <div class="col-md-6">
                <div class="image">
                    <img class="compact-img" src="assets/img/blog/blog-details-image3.webp" alt="Jorge Alberto Vera Villamizar en las instalaciones de Vera Villamizar Abogados" loading="lazy" decoding="async">
                </div>
            </div>
        </div>
        <div class="heading mt-30">
            <h2 class="black1 text-32 sm:text-30 md:text-30 leading-32 font-semibold">{{ detail.sectionHeading }}</h2>
            <p *ngFor="let paragraph of detail.section" class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ paragraph }}</p>
        </div>
        <div class="row mt-10">
            <div class="col-lg-4 col-md-6" *ngFor="let point of detail.points">
                <ul>
                    <li class="detials-check-list">
                        <span class="check">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        {{ point }}
                    </li>
                </ul>
            </div>
        </div>

    </div>
</article>
<article>
    <div class="details-content mt-50">
        <div class="video-area _relative">
            <div class="image">
                <img class="w-full" src="assets/img/blog/video-abogada.webp" alt="Abogada de Vera Villamizar Abogados en su oficina" loading="lazy" decoding="async">
            </div>
            <div class="details-video">
                <a id="play-video play-btn" class="video-play-button">
                    <span></span>
                </a>
            </div>
        </div>
        <div class="heading mt-30">
            <h2 class="black1 text-32 sm:text-30 md:text-30 leading-32 font-semibold">{{ detail.closingHeading }}</h2>
            <p class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ detail.closing }}</p>
        </div>
    </div>
</article>
