<app-page-header title="Blog Jurídico" />

<div class="blog1 sp white-bg3">
    <div class="container">

        <div class="row">
            <div *ngFor="let blog of blogs" class="col-lg-4 col-md-6">
                <app-blog-card [blog]="blog"/>
            </div>
        </div>

        @if (showPagination) {
        <div class="space50"></div>
        <div class="row">
            <div class="col-12 m-auto">
                <app-pagination />
            </div>
        </div>
        }

    </div>
</div>
