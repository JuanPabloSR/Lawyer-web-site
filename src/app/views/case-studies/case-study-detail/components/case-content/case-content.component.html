<article>
    <div class="details-content">
        <div class="image">
            <img [src]="case.heroImage ?? case.image" [class.case-hero]="!case.heroImage"
                [alt]="case.title + ' - Caso de ' + case.category + ' en Vera Villamizar Abogados'">
        </div>
        <div class="heading mt-30">
            <h2 class="black1 text-38 sm:text-30 md:text-30 leading-38 font-semibold text-anime-style-3">
                {{ case.heading }}</h2>
            <p *ngFor="let paragraph of case.intro" class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ paragraph }}</p>
        </div>
    </div>
</article>

<article>
    <div class="details-content mt-50">
        <div class="heading mt-30">
            <h2 class="black1 text-32 sm:text-30 md:text-30 leading-32 font-semibold">Análisis
                Probatorio y Estrategia Legal</h2>
            <p *ngFor="let paragraph of case.strategy" class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ paragraph }}</p>
        </div>
        <div class="row mt-10">
            <div class="col-lg-4 col-md-6" *ngFor="let benefit of case.benefits">
              <ul>
                <li class="detials-check-list2">
                  <span class="check"><i class="fa-solid fa-check"></i></span>
                  {{ benefit }}
                </li>
              </ul>
            </div>
          </div>

    </div>
</article>

<article>
    <div class="details-content mt-50">
        <div class="heading mt-30">
            <h2 class="black1 text-32 sm:text-30 md:text-30 leading-32 font-semibold">Impacto y
                Resultados Obtenidos</h2>
            <p class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ case.result }}</p>
        </div>

        @if (showPercentages) {
        <div class="about-page-progress-area">
            <div *ngFor="let item of progressData; let last = last">
              <div class="about-page-progress">
                <div class="text-area">
                  <p>{{ item.title }}</p>
                  <p>{{ item.value }}%</p>
                </div>
                <div class="progress">
                  <div
                    class="progress-bar"
                    [style.width.%]="item.value"
                    role="progressbar"
                    [attr.aria-valuenow]="item.value"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
              </div>

              <div class="space30" *ngIf="!last"></div>
            </div>
          </div>
        }


    </div>
</article>
