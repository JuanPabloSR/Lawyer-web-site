<div class="about-page-brand sec-bg1">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <p>Únete a los más de 800 clientes que han confiado la protección de su futuro en nosotros y conoce a nuestros aliados estratégicos</p>
                <ngx-slick-carousel [config]="sliderConfig" class="about-brand-slider">
                    <div ngxSlickItem *ngFor="let image of companyImages" class="single-brand">
                        <img [src]="image" alt="">
                    </div>
                </ngx-slick-carousel>
            </div>
        </div>
    </div>
</div>
