<div class="about-page-brand sec-bg1">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <p>Conoce a las empresas e instituciones que han depositado su confianza en nuestra asesoría y respaldo legal estratégico.</p>
                <ngx-slick-carousel [config]="sliderConfig" class="about-brand-slider">
                    <div ngxSlickItem *ngFor="let company of companies" class="single-brand" [class.single-brand-dark]="company.onDark">
                        <img [src]="company.logo" [alt]="company.alt" class="about-brand-logo">
                    </div>
                </ngx-slick-carousel>
            </div>
        </div>
    </div>
</div>
