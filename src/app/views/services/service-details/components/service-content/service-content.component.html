<article>
    <div class="details-content">
        <div class="image">
            <img src="assets/img/service/service-details-image1.webp" alt="Asesoría Pensional">
        </div>
        <div class="heading mt-30">
            <h2 class="black1 text-38 sm:text-30 md:text-30 leading-38 font-semibold text-anime-style-3">
                {{ detail.heading }}
            </h2>
            <p *ngFor="let paragraph of detail.intro" class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ paragraph }}</p>
        </div>
        <div class="row mt-10">
            <div class="col-lg-4 col-md-6" *ngFor="let point of detail.points">
              <ul>
                <li class="detials-check-list">
                  <span class="check"><i class="fa-solid fa-check"></i></span> {{ point }}
                </li>
              </ul>
            </div>
          </div>

    </div>
</article>

<article>
    <div class="details-content mt-50">
        <div class="row">
            <div class="col-md-6">
                <div class="image">
                    <img src="assets/img/service/service-details-image2.webp" alt="Abogados Laborales">
                </div>
            </div>
            <div class="col-md-6">
                <div class="image">
                    <img src="assets/img/service/service-details-image3.webp" alt="Litigio Estratégico">
                </div>
            </div>
        </div>
        <div class="heading mt-30">
            <h2 class="black1 text-32 sm:text-30 md:text-30 leading-32 font-semibold">
                {{ detail.approachHeading }}
            </h2>
            <p *ngFor="let paragraph of detail.approach" class="black2 font-18 leading-26 gray1 font-medium mt-16">{{ paragraph }}</p>
        </div>
    </div>
</article>

@if (detail.showFaq) {
<article>
    <div class="details-content mt-50">
        <div class="heading mt-30">
            <h2 class="black1 pb-20 text-32 sm:text-30 md:text-30 leading-32 font-semibold">
                Preguntas Frecuentes (FAQ)
            </h2>
        </div>

        <div ngbAccordion [closeOthers]="true" class="accordion accordion1" id="accordionExample">
            <div *ngFor="let faq of faqData1;let i =index" [collapsed]="i !== activeItemIndex"
            [class.active]="i === activeItemIndex" (shown)="activeItemIndex = i" ngbAccordionItem="{{i}}" class="accordion-item">
              <h2 ngbAccordionHeader class="accordion-header" id="headingOne">
                <button ngbAccordionButton class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                 {{faq.question}}
                </button>
              </h2>
              <div id="collapseOne" ngbAccordionCollapse aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                <div class="accordion-body" ngbAccordionBody>
                  {{faq.answer}}
                </div>
              </div>
            </div>
          </div>

    </div>
</article>
}
