<div class="theme-toggle-container">
    <label class="theme-switch">
        <input type="checkbox" id="theme-toggle" (change)="toggleTheme($event)">
        <span class="slider">
            <i class="fas fa-sun icon sun-icon"></i>
            <i class="fas fa-moon icon moon-icon"></i>
        </span>
    </label>
</div>
