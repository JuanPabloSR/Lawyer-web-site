@if (totalPages) {
<nav class="theme-pagination text-center" aria-label="Paginación">
    <ul>
        <li><a href="javascript:void(0)" [class.disabled]="page <= 1" (click)="go(page - 1)" aria-label="Página anterior"><i class="fa-solid fa-angle-left"></i></a></li>
        @for (n of pages; track n) {
        <li><a href="javascript:void(0)" [class.active]="n === page" [attr.aria-current]="n === page ? 'page' : null" (click)="go(n)">{{ label(n) }}</a></li>
        }
        <li><a href="javascript:void(0)" [class.disabled]="page >= totalPages" (click)="go(page + 1)" aria-label="Página siguiente"><i class="fa-solid fa-angle-right"></i></a></li>
    </ul>
</nav>
} @else {
<div class="theme-pagination text-center">
    <ul>
        <li><a href="javascript:void(0)"><i class="fa-solid fa-angle-left"></i></a></li>
        <li><a class="active" href="javascript:void(0)">01</a></li>
        <li><a href="javascript:void(0)">02</a></li>
        <li>...</li>
        <li><a href="javascript:void(0)">12</a></li>
        <li><a href="javascript:void(0)"><i class="fa-solid fa-angle-right"></i></a></li>
    </ul>
</div>
}
