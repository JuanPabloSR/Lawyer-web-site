<app-search-popup [isSearchOpen]="isSearchOpen" />
<header>
    <div id="vl-header-sticky" class="vl-header-area1 header-tranperent" stickyScroll>
        <div class="container header1-bg">
            <div class="row align-items-center pt-16 sm:pt-0 md:pt-0">
                <div class="col-lg-2 col-md-6 col-6">
                    <div class="vl-logo">
                        <a routerLink="/home-1" class="header1-logo-block"><img src="assets/img/logo/header-logo1.png"
                                alt="Vera Villamizar Abogados"></a>
                        <a routerLink="/home-1" class="header1-logo-white"><img src="assets/img/logo/white-logo.png"
                                alt="Vera Villamizar Abogados"></a>
                    </div>
                </div>
                <div class="col-lg-7 d-none d-lg-block">
                    <div class="vl-main-menu text-center">
                        <nav class="vl-mobile-menu-active">
                            <app-nav-item themeBtn="theme-btn1" />
                        </nav>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 col-6">
                    <div class="vl-header1-right d-none d-lg-flex">
                        <div class="vl-search-top">
                            <button class="search-open-btn" (click)="openSearch()"><i
                                    class="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                        <div class="header1-social-wedget gap-1 d-flex align-items-center flex-wrap">
                            <a href="https://www.facebook.com/share/16wvkGYPjN/?mibextid=wwXIfr" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                            <a href="https://www.instagram.com/veravillamizar_abogados?igsh=YmxxNW03dGF3ZDRl" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                            <a href="https://www.linkedin.com/company/vera-villamizar-abogados/?viewAsMember=true" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                            <a href="https://www.tiktok.com/@veravillamizarabogados" target="_blank" rel="noopener" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                        </div>
                    </div>
                    <div class="vl-header-action-item d-block d-lg-none">
                        <button type="button" class="vl-offcanvas-toggle" (click)="toggleMenu()">
                            <i class="fa-duotone fa-solid fa-bars-staggered"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<app-mobile-menu [isMenuOpen]="isMenuOpen" (closeMenuEvent)="closeMenu()" themeBtn="theme-btn1" />
